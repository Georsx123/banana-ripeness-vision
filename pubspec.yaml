name: banana_ripeness_vision
description: Aplikasi deteksi tingkat kematangan pisang dengan AI.
publish_to: 'none'
version: 1.0.6+6

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  fl_chart: ^0.69.2
  image_picker: ^1.1.2
  camera: ^0.11.0
  http: ^1.2.2
  web: ^1.1.1
  share_plus: ^13.3.1
  path_provider: ^2.1.6

flutter:
  uses-material-design: true

  assets:
       - assets/images/

  fonts:
       - family: Roboto
         fonts:
           - asset: assets/fonts/Roboto-Regular.ttf
           - asset: assets/fonts/Roboto-Medium.ttf
             weight: 300
           - asset: assets/fonts/Roboto-Bold.ttf
             weight: 500
           - asset: assets/fonts/Roboto-Black.ttf
             weight: 700
