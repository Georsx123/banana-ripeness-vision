# Membuat file APK Android di server GitHub (tanpa Android SDK di laptop),
# ditandatangani dengan KUNCI SENDIRI supaya APK baru bisa menimpa APK lama tanpa hapus dulu.
# Cara pakai: GitHub > tab Actions > "Build APK" > Run workflow.
# Berjalan HANYA saat dijalankan manual, tidak ikut aktif setiap Sync Changes.
#
# Butuh 3 Secret di GitHub (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64   isi berkas kunci (.jks) dalam bentuk base64
#   ANDROID_KEYSTORE_PASSWORD password kunci
#   ANDROID_KEY_ALIAS         nama alias kunci (mis. bananavision)
name: Build APK

on:
  workflow_dispatch:
    inputs:
      rilis:
        description: 'Terbitkan sebagai Release publik (alamat unduh tetap)?'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'   # samakan dengan versi di laptop (cek: flutter --version)
          channel: stable
          cache: true

      - name: Siapkan kunci tanda tangan
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "Secret kunci tanda tangan belum lengkap (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - name: Siapkan izin internet, kamera, dan nama aplikasi Android
        run: |
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$M"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <application|' "$M"
          fi
          sed -i 's|android:label="[^"]*"|android:label="Banana Vision"|' "$M"

      - run: flutter pub get

      # Nomor build naik otomatis tiap proses (1000 + nomor proses), syarat agar Android menerima sebagai pembaruan.
      - run: flutter build apk --release --build-number=$((1000 + ${{ github.run_number }})) --build-name=1.0.${{ github.run_number }}

      - name: Beri nama berkas
        run: cp build/app/outputs/flutter-apk/app-release.apk banana-vision.apk

      - uses: actions/upload-artifact@v4
        with:
          name: banana-vision-apk
          path: banana-vision.apk

      - name: Terbitkan Release publik
        if: ${{ inputs.rilis }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Banana Vision APK (build ${{ github.run_number }})
          files: banana-vision.apk
          make_latest: true
