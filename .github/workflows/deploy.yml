name: Deploy Flutter Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Siapkan folder web
        run: |
          mkdir -p /tmp/backup
          cp pubspec.yaml /tmp/backup/pubspec.yaml
          cp -r lib /tmp/backup/lib
          flutter create --platforms=web --project-name banana_ripeness_vision --org com.bananavision .
          cp /tmp/backup/pubspec.yaml pubspec.yaml
          rm -rf lib && cp -r /tmp/backup/lib lib
          rm -rf test analysis_options.yaml
          sed -i 's|<title>.*</title>|<title>Banana Ripeness Vision</title>|' web/index.html
          sed -i 's|"name": "[^"]*"|"name": "Banana Ripeness Vision"|; s|"short_name": "[^"]*"|"short_name": "Banana Vision"|; s|"theme_color": "[^"]*"|"theme_color": "#F9A825"|' web/manifest.json

      - run: flutter pub get

      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
